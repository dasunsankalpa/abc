<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Publish</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      main {
        width: min(960px, 92vw);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.2rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 14px;
        color: #cbd5e1;
      }
      video {
        width: 100%;
        border-radius: 14px;
        background: #000;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Published Video</h1>
      <p>If playback does not start, click play manually.</p>
      <video controls preload="metadata">
        <source src="Untitled%20Project.mp4" type="video/mp4" />
        Your browser does not support HTML video.
      </video>
    </main>
  </body>
</html>
